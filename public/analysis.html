<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader Guider — Analysis Hub</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <div class="logo" style="cursor:pointer" onclick="location.href='/terminal'">Trader Guider <small>analysis hub</small></div>
  <div class="spacer"></div>
  <button class="link" onclick="location.href='/terminal'">← Back to terminal</button>
  <button class="link" id="logoutBtn">Logout</button>
</div>
<div class="hub">
  <div class="tabs">
    <button class="tf-btn active" id="tabPublic">🌍 Public gallery</button>
    <button class="tf-btn" id="tabMine">👤 My analyses</button>
  </div>
  <div class="hub-grid" id="grid"></div>
  <div id="empty" style="color:var(--dim);display:none">Nothing here yet — save an analysis from the terminal.</div>
</div>

<div class="modal-back" id="viewModal">
  <div class="modal" style="width:720px">
    <h2 id="vTitle"></h2>
    <div class="meta" id="vMeta" style="color:var(--dim);font-size:12px;margin-bottom:10px"></div>
    <img id="vImg" style="width:100%;border-radius:8px;background:#000;display:none">
    <div id="vTags" style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0"></div>
    <p id="vBody" style="white-space:pre-wrap;font-size:14px"></p>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="vLoad">Load this chart state into my terminal</button>
      <button class="btn" id="vDel" style="display:none;border-color:var(--red);color:var(--red)">Delete</button>
    </div>
  </div>
</div>

<script src="/js/analysis.js"></script>
</body>
</html>
